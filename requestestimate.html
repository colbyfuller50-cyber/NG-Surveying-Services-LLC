<style>

.content{
padding:55px 6%;
display:flex;
flex-direction:column;
align-items:center;
}

.page-title{
margin:0 0 10px;
color:#0e2239;
font-size:clamp(1.7rem,2.4vw,2.3rem);
text-align:center;
}

.page-subtitle{
margin:0 0 26px;
color:#555;
max-width:72ch;
text-align:center;
}

.estimate-shell{
width:100%;
max-width:980px;
display:grid;
gap:18px;
justify-items:center;
}

.card{
width:100%;
max-width:760px;
background:#fff;
border-radius:16px;
border:1px solid rgba(14,34,57,0.10);
box-shadow:0 10px 24px rgba(14,34,57,0.10);
overflow:hidden;
}

.card-header{
padding:18px;
background:linear-gradient(180deg,rgba(14,34,57,0.06),rgba(14,34,57,0));
border-bottom:1px solid rgba(14,34,57,0.08);
}

.card-header h3{
margin:0;
color:#0e2239;
display:flex;
gap:10px;
align-items:center;
}

.card-body{
padding:18px;
display:flex;
justify-content:center;
}

.form-inner{
width:100%;
max-width:640px;
}

.modern-form{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.field{
display:flex;
flex-direction:column;
gap:8px;
}

.field.full{
grid-column:1/-1;
}

label{
font-weight:700;
color:#0e2239;
font-size:.95rem;
}

input,textarea{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid rgba(14,34,57,0.18);
background:#fbfcfe;
transition:all .18s ease;
font-size:.98rem;
}

input:focus,textarea:focus{
border-color:rgba(255,69,0,.55);
box-shadow:0 0 0 4px rgba(255,69,0,.14);
background:#fff;
}

textarea{
resize:vertical;
}

.help-text{
color:#666;
font-size:.9rem;
}

.btn-modern{
padding:12px 16px;
border-radius:12px;
border:1px solid rgba(14,34,57,0.18);
font-weight:800;
cursor:pointer;
background:#fff;
}

.btn-primary{
background:#0e2239;
color:#fff;
}

.btn-primary.is-loading{
opacity:.92;
cursor:not-allowed;
}

.spinner{
width:16px;
height:16px;
border-radius:999px;
border:2px solid rgba(255,255,255,.35);
border-top-color:#fff;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

/* dropdown style */

.select-wrap{
position:relative;
}

.select-wrap select{
width:100%;
padding:12px 40px 12px 12px;
border-radius:12px;
border:1px solid rgba(14,34,57,.18);
background:#fbfcfe;
font-size:.98rem;
appearance:none;
cursor:pointer;
}

.select-wrap select:focus{
border-color:rgba(255,69,0,.55);
box-shadow:0 0 0 4px rgba(255,69,0,.14);
background:#fff;
}

.select-icon{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
color:rgba(14,34,57,.55);
font-size:.85rem;
}

/* pills */

.pill-group{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.pill input{
position:absolute;
opacity:0;
}

.pill label{
padding:10px 12px;
border-radius:999px;
border:1px solid rgba(14,34,57,.18);
font-weight:800;
cursor:pointer;
background:#fbfcfe;
}

.pill input:checked + label{
border-color:rgba(255,69,0,.55);
background:rgba(255,69,0,.08);
}

.inline-error{
display:none;
color:#b42318;
font-weight:700;
}

.inline-error.show{
display:block;
}

.map-box{
width:100%;
height:360px;
border:0;
}

.site-logo .logo-img{
height:60px;
}

@media(max-width:740px){
.modern-form{
grid-template-columns:1fr;
}
}

</style>

<body>

<header>

<a href="index.html" class="site-logo">
<img src="https://raw.githubusercontent.com/colbyfuller50-cyber/NG-Surveying-Services-LLC/main/white-logo.png"
alt="NG Surveying Logo"
class="logo-img">
</a>

<nav class="navbar">

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="services.html">Services</a></li>

</ul>

<div class="hamburger">
<span></span>
<span></span>
<span></span>
</div>

</nav>

</header>

<section class="content">

<h2 class="page-title">Request an Estimate</h2>

<p class="page-subtitle">
Complete the form below and we’ll review your request.
</p>

<div class="estimate-shell">

<div class="card">

<div class="card-header">
<h3><i class="fa-solid fa-file-signature"></i> Estimate Request Form</h3>
</div>

<div class="card-body">

<div class="form-inner">

<form id="estimateForm"
action="https://formspree.io/f/mwpaqdaa"
method="POST"
class="modern-form">

<div class="field full">
<label>Name or Company</label>

<input type="text"
name="name"
required>
</div>

<div class="field">
<label>Email</label>

<input type="email"
name="_replyto"
required>
</div>

<div class="field">
<label>Phone</label>

<input type="text"
name="phone"
required>
</div>

<!-- NEW DROPDOWN -->

<div class="field">
<label>Preferred Contact Method</label>

<div class="select-wrap">

<select name="Preferred Contact Method" required>

<option value="">
Select
</option>

<option>Email</option>

<option>Phone</option>

</select>

<i class="fa-solid fa-chevron-down select-icon"></i>

</div>
</div>

<div class="field full">
<label>Property Address</label>

<textarea id="address"
name="address"
rows="2"
required></textarea>

<button type="button"
class="btn-modern"
onclick="updateMap()">
Preview Map
</button>

</div>

<div class="field full">
<label>Tax Map</label>

<input name="Tax Map">
</div>

<div class="field full">

<label>Job Type</label>

<div class="pill-group">

<div class="pill">
<input type="checkbox"
name="job[]"
value="Boundary Survey">

<label>Boundary Survey</label>
</div>

<div class="pill">
<input type="checkbox"
name="job[]"
value="Property Line Marking">

<label>Property Line</label>
</div>

</div>

<div id="jobError"
class="inline-error">

Select at least one job type

</div>

</div>

<div class="field full">

<label>Description</label>

<textarea name="details"
rows="5"
required></textarea>

</div>

<div class="field full">

<button id="submitBtn"
type="submit"
class="btn-modern btn-primary">

Submit Request

</button>

</div>

</form>

</div>

</div>

</div>

<div class="card">

<div class="card-header">

<h3>

<i class="fa-solid fa-map"></i>

Address Preview

</h3>

</div>

<iframe id="map"
class="map-box"
src="https://www.google.com/maps?q=Columbia,+SC&output=embed">

</iframe>

</div>

</div>

</section>

<footer>

<p>

© 2026 NG Surveying Services LLC

</p>

</footer>

<script>

function updateMap(){

let address =
document.getElementById("address").value;

document.getElementById("map").src =
"https://www.google.com/maps?q="
+ encodeURIComponent(address)
+ "&output=embed";

}

const form =
document.getElementById("estimateForm");

const jobCheckboxes =
document.querySelectorAll('input[name="job[]"]');

const error =
document.getElementById("jobError");

form.addEventListener("submit",(e)=>{

let selected =
Array.from(jobCheckboxes)
.some(x=>x.checked);

if(!selected){

e.preventDefault();

error.classList.add("show");

}

});

</script>

</body>
